name: pack-installer
# 打包爱坤工具箱安装器: 收集各子项目资源 -> 交叉编译 win-x64 单文件 exe -> 更新 Release
# [2026-09-22] 由 Gitea Actions 迁移至 GitHub Actions:
#   - runs-on: dotnet (act_runner 自定义标签) -> ubuntu-latest + actions/setup-dotnet
#   - 新增 actions/checkout@v4 (fetch-depth: 0), 替代原先手写 GIT_ASKPASS 浅克隆
#   - ci/assemble.sh + ci/publish-release.sh 已适配 GitHub API (含 uploads.github.com 附件上传)
# 触发: 子项目 push 后经 dispatch(workflow_dispatch), 或本仓库关键文件变更(push)
on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - ikun_installer.csproj
      - Form1.cs
      - TelemetryClient.cs
      - Program.cs
      - AppConfig.cs
      - Versioning.cs
      - DeploymentLayout.cs
      - UpdateManager.cs
      - UpdateCheckForm.cs
      - ResourceManifest.cs
      - plugins.json
      - CHANGELOG.md
      - ci/**
      - nxplugin/**
      - tests/**
      - DeployResources/startup/**
      - .github/workflows/**

jobs:
  pack:
    runs-on: ubuntu-latest
    env:
      # M11: 打包 PAT 与通知 dispatch token 分离 (规范 §11.2 双 token 模型)
      # INSTALLER_RELEASE_TOKEN: 仅存在于安装器仓 (clone 私有仓 + release/tag/资产写)
      PAT: ${{ secrets.INSTALLER_RELEASE_TOKEN }}
      GIT_HOST: github.com
      API_BASE: https://api.github.com
      UPLOAD_BASE: https://uploads.github.com
      OWNER: ${{ github.repository_owner }}
      GIT_REPO: ikun_installer
      RELEASE_TAG: latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # G6 secret 扫描需要父提交 (原 Gitea 版需 fetch --unshallow)

      - name: 安装 .NET SDK 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 准备工具 (jq/binutils/libxml2-utils/python3)
        run: |
          set -e
          # G 系闸门工具 (规范 M7b): objdump(PE 导出), xmllint(dlx XML), python3(G5/G7), strings(G8)
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq binutils libxml2-utils python3 >/dev/null
          echo "jq $(jq --version), objdump $(objdump --version | head -1), xmllint $(xmllint --version 2>&1 | head -1), python3 $(python3 --version)"
          echo "dotnet $(dotnet --version)"

      - name: 计算版本号
        run: |
          set -e
          BASE=$(grep -oP '<Version>\K[^<]+' ikun_installer.csproj | head -1)
          BASE="${BASE:-0.0.0}"
          BUILD="${{ github.run_number }}"
          [ -z "$BUILD" ] && BUILD="$(date '+%Y%m%d')"
          echo "VERSION=${BASE}.${BUILD}" >> "$GITHUB_ENV"
          echo "版本: ${BASE}.${BUILD}"

      - name: 分类本次发布变更
        run: |
          set -e
          previous_commit=""
          previous_installer_version=""
          if previous_json=$(curl --fail --silent --show-error --max-time 20 \
              -H "Authorization: token ${PAT}" \
              -H "Accept: application/vnd.github+json" \
              "${API_BASE}/repos/${OWNER}/${GIT_REPO}/releases/tags/${RELEASE_TAG}" 2>/dev/null); then
            previous_body=$(printf '%s' "$previous_json" | jq -r '.body // ""')
            # GitHub 的 target_commitish 可能是分支名; 优先取 tag 指向的提交 SHA
            previous_commit=$(curl --fail --silent --show-error --max-time 20 \
              -H "Authorization: token ${PAT}" \
              -H "Accept: application/vnd.github+json" \
              "https://${API_BASE#https://}/repos/${OWNER}/${GIT_REPO}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null | jq -r '.object.sha // empty')
            [ -z "$previous_commit" ] && previous_commit=$(printf '%s' "$previous_json" | jq -r '.target_commitish // empty')
            previous_installer_version=$(printf '%s' "$previous_body" | \
              grep -oE '<!-- ikun-installer-version:[0-9]+(\.[0-9]+){2,3} -->' | \
              tail -1 | grep -oE '[0-9]+(\.[0-9]+){2,3}' || true)
            if [ -z "$previous_installer_version" ]; then
              previous_name=$(printf '%s' "$previous_json" | jq -r '.name // ""')
              previous_installer_version=$(printf '%s' "$previous_name" | \
                grep -oE '[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' | tail -1 || true)
            fi
          fi
          if ! [[ "$previous_commit" =~ ^[0-9a-fA-F]{7,64}$ ]]; then previous_commit=""; fi
          echo "上次提交: ${previous_commit:-<无>}"
          classification=$(bash ci/classify-update.sh "$previous_commit" "$VERSION" "$previous_installer_version")
          printf '%s\n' "$classification" | tee /tmp/ikun-update-classification.env
          cat /tmp/ikun-update-classification.env >> "$GITHUB_ENV"

      - name: 回归测试子插件更新记录
        run: bash ci/test-release-notes.sh

      - name: 回归测试更新分类
        run: bash ci/test-update-classification.sh

      - name: "纯逻辑测试 (M9 版本契约/部署槽)"
        run: dotnet run --project tests -c Release

      - name: 收集子项目部署资源
        run: bash ci/assemble.sh

      - name: 生成缺失的工具栏图标
        run: bash ci/gen-icons.sh

      - name: 闸门 G2/G3/G6 (规范 §7.3)
        run: bash ci/gates.sh

      - name: 闸门 G5/G7 一致性 (规范 §7.3)
        run: python3 ci/check_consistency.py

      - name: 交叉编译单文件 exe (win-x64)
        run: |
          set -e
          dotnet publish ikun_installer.csproj -c Release \
            -p:EnableWindowsTargeting=true -p:Version="${VERSION}" -o out
          ls -la out/ikun_installer.exe

      - name: 生成插件资源增量包
        run: bash ci/make-resource-manifest.sh DeployResources out/resources "${VERSION}" "${INSTALLER_VERSION}" "${UPDATE_KIND}"

      - name: 更新 Release (安装器 exe + 插件资源)
        run: |
          set -e
          export BUILD_TIME="$(date '+%Y-%m-%d %H:%M') UTC"
          export VERSION="${VERSION}"
          export PLUGIN_COUNT="$(jq '.plugins | length' plugins.json)"
          bash ci/publish-release.sh out/ikun_installer.exe out/resources/ikun_resources.json out/resources
