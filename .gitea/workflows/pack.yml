name: pack-installer
# 打包爱坤工具箱安装器: 收集各子项目资源 -> 交叉编译 win-x64 单文件 exe -> 更新 Gitea Release
# 触发: 子项目 push 后经 dispatch(workflow_dispatch), 或本仓库关键文件变更(push)
on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - ikun_installer.csproj
      - Form1.cs
      - TelemetryClient.cs
      - Program.cs
      - AppConfig.cs
      - Versioning.cs
      - DeploymentLayout.cs
      - UpdateManager.cs
      - UpdateCheckForm.cs
      - plugins.json
      - CHANGELOG.md
      - ci/**
      - nxplugin/**
      - tests/**
      - DeployResources/startup/**

jobs:
  pack:
    runs-on: dotnet          # act_runner 上映射为 docker://mcr.microsoft.com/dotnet/sdk:9.0
    env:
      # M11: 打包 PAT 与通知 dispatch token 分离 (规范 §11.2 双 token 模型)
      # INSTALLER_RELEASE_TOKEN: 仅存在于安装器仓 (clone 私有仓 + release/tag/资产写)
      PAT: ${{ secrets.INSTALLER_RELEASE_TOKEN }}
      GITEA_HOST: gt.h.zss.fan:2233
      GITEA_OWNER: zhaoshen
      GITEA_REPO: ikun_installer
      RELEASE_TAG: latest
    steps:
      - name: 准备工具 (jq/binutils/libxml2-utils/python3)
        run: |
          set -e
          if ! command -v jq >/dev/null; then
            apt-get update -qq && apt-get install -y -qq jq >/dev/null
          fi
          # G 系闸门工具 (规范 M7b): objdump(PE 导出), xmllint(dlx XML), python3(G5/G7), strings(G8)
          apt-get update -qq && apt-get install -y -qq binutils libxml2-utils python3 >/dev/null
          echo "jq $(jq --version), objdump $(objdump --version | head -1), xmllint $(xmllint --version 2>&1 | head -1), python3 $(python3 --version)"

      - name: 拉取安装器仓库
        run: |
          set -e
          rm -rf repo
          ASKPASS="$(mktemp)"
          trap 'rm -f "$ASKPASS"' EXIT
          cat >"$ASKPASS" <<'ASKPASS_EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$GITEA_OWNER" ;;
            *)          printf '%s\n' "$PAT" ;;
          esac
          ASKPASS_EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          git clone --quiet --depth 1 --branch master \
            "https://${GITEA_HOST}/${GITEA_OWNER}/${GITEA_REPO}.git" repo
          # G6 secret 扫描需要父提交 (红队批1 P1-3): 补全浅历史
          git -C repo fetch --quiet --unshallow origin || true

      - name: 计算版本号
        working-directory: repo
        run: |
          set -e
          BASE=$(grep -oP '<Version>\K[^<]+' ikun_installer.csproj | head -1)
          BASE="${BASE:-0.0.0}"
          BUILD="${{ github.run_number }}"
          [ -z "$BUILD" ] && BUILD="$(date '+%Y%m%d')"
          echo "VERSION=${BASE}.${BUILD}" >> "$GITHUB_ENV"
          echo "版本: ${BASE}.${BUILD}"

      - name: 回归测试子插件更新记录
        working-directory: repo
        run: bash ci/test-release-notes.sh

      - name: "纯逻辑测试 (M9 版本契约/部署槽)"
        working-directory: repo
        run: dotnet run --project tests -c Release

      - name: 收集子项目部署资源
        working-directory: repo
        run: bash ci/assemble.sh

      - name: 生成缺失的工具栏图标
        working-directory: repo
        run: bash ci/gen-icons.sh

      - name: 闸门 G2/G3/G6 (规范 §7.3)
        working-directory: repo
        run: bash ci/gates.sh

      - name: 闸门 G5/G7 一致性 (规范 §7.3)
        working-directory: repo
        run: python3 ci/check_consistency.py

      - name: 交叉编译单文件 exe (win-x64)
        working-directory: repo
        run: |
          set -e
          dotnet publish ikun_installer.csproj -c Release \
            -p:EnableWindowsTargeting=true -p:Version="${VERSION}" -o out
          ls -la out/ikun_installer.exe

      - name: 生成插件资源增量包
        working-directory: repo
        run: bash ci/make-resource-manifest.sh DeployResources out/resources "${VERSION}"

      - name: 更新 Gitea Release (安装器 exe + 插件资源)
        working-directory: repo
        run: |
          set -e
          export BUILD_TIME="$(date '+%Y-%m-%d %H:%M') CST"
          export VERSION="${VERSION}"
          export PLUGIN_COUNT="$(jq '.plugins | length' plugins.json)"
          bash ci/publish-release.sh out/ikun_installer.exe out/resources/ikun_resources.json out/resources
