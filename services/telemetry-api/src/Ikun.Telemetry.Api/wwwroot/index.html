<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>爱坤遥测小岛</title>
<style>
:root{--animal-bg:#f8eedb;--animal-paper:#fffaf0;--animal-mint:#72c8b6;--animal-mint-dark:#328f83;--animal-brown:#654b3b;--animal-sand:#e9c995;--animal-yellow:#f6c85f;--animal-coral:#e9987f;--animal-radius:24px;--animal-ease:cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box}body{margin:0;background:var(--animal-bg);color:var(--animal-brown);font-family:Nunito,"Noto Sans SC","Microsoft YaHei",sans-serif;font-weight:500}
.shell{max-width:1180px;margin:auto;padding:28px 22px 46px}.hero{position:relative;background:var(--animal-mint);border:4px solid #4fa99b;border-radius:34px;padding:28px 34px;overflow:hidden;box-shadow:0 7px 0 #4b9c90}.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:48% 52% 62% 38%;right:40px;top:-74px;background:#a4dfc8;opacity:.7}.eyebrow{letter-spacing:2px;font-size:13px;color:#276e67}.hero h1{position:relative;z-index:1;margin:7px 0 5px;font-size:clamp(28px,5vw,48px);font-weight:900}.hero p{position:relative;z-index:1;margin:0;font-size:16px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:28px 0 16px;flex-wrap:wrap}.toolbar h2{margin:0;font-size:24px}.pill{border:0;border-radius:50px;background:var(--animal-mint-dark);color:#fffaf0;padding:12px 20px;font:700 15px inherit;cursor:pointer;box-shadow:0 5px 0 #256e67;transition:transform .2s var(--animal-ease),box-shadow .2s var(--animal-ease)}.pill:hover{transform:translateY(-2px);box-shadow:0 7px 0 #256e67}.pill:active{transform:translateY(3px);box-shadow:0 2px 0 #256e67}.status{font-size:14px;color:#7e6550}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--animal-paper);border:2px solid var(--animal-sand);border-radius:var(--animal-radius);padding:20px}.card .label{font-size:14px;color:#93725a}.card .value{font-size:34px;font-weight:900;margin-top:8px}.card:nth-child(2){border-color:#a9d9c9}.card:nth-child(3){border-color:#f2cf82}.card:nth-child(4){border-color:#edb29d}.panel{margin-top:22px;background:var(--animal-paper);border:2px solid var(--animal-sand);border-radius:var(--animal-radius);padding:22px}.panel h3{margin:0 0 16px;font-size:21px}.table-wrap{overflow:auto}table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:680px}th{text-align:left;font-size:13px;color:#93725a;padding:0 12px}td{background:#fffdf7;padding:13px 12px;border-top:1px solid #f0ddba;border-bottom:1px solid #f0ddba}td:first-child{border-left:1px solid #f0ddba;border-radius:15px 0 0 15px}td:last-child{border-right:1px solid #f0ddba;border-radius:0 15px 15px 0}.tag{display:inline-block;border-radius:50px;padding:5px 10px;background:#d9f0e6;color:#397c6f;font-size:12px;font-weight:800}.tag.coral{background:#f9ded1;color:#a45c4a}.empty{text-align:center;color:#9b7c63;padding:28px}.footer{text-align:center;margin-top:28px;color:#9b7c63;font-size:13px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.cards{grid-template-columns:1fr}.shell{padding:16px 12px}.hero{padding:24px 22px}}
</style></head>
<body><main class="shell"><section class="hero"><div class="eyebrow">IKUN TOOLBOX · MANAGED TELEMETRY</div><h1>爱坤遥测小岛</h1><p>把每一次更新检查，变成岛上的一盏温柔小灯。</p></section>
<div class="toolbar"><h2>今日岛屿简报</h2><div><span id="status" class="status">正在驶入小岛…</span> <button id="refresh" class="pill">刷新数据</button></div></div>
<section class="cards"><article class="card"><div class="label">登记设备</div><div id="devices" class="value">—</div></article><article class="card"><div class="label">活跃设备</div><div id="active" class="value">—</div></article><article class="card"><div class="label">24 小时事件</div><div id="events24" class="value">—</div></article><article class="card"><div class="label">24 小时快照</div><div id="snapshots24" class="value">—</div></article></section>
<section class="panel"><h3>最近的岛屿动态</h3><div class="table-wrap"><table><thead><tr><th>事件</th><th>触发来源</th><th>结果</th><th>安装器</th><th>远端版本</th><th>接收时间</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">正在整理动态…</td></tr></tbody></table></div></section>
<div class="footer">仅限受管管理员访问 · 数据按服务端保留策略清理</div></main>
<script>
const $=id=>document.getElementById(id);const fmt=x=>new Date(x).toLocaleString('zh-CN',{hour12:false});
async function load(){ $('status').textContent='正在收集最新潮汐…';try{const [s,e]=await Promise.all([fetch('/dashboard/api/summary'),fetch('/dashboard/api/events')]);if(!s.ok||!e.ok)throw Error();const a=await s.json(), rows=await e.json();$('devices').textContent=a.devices;$('active').textContent=a.active_devices;$('events24').textContent=a.events_24h;$('snapshots24').textContent=a.snapshots_24h;$('rows').innerHTML=rows.length?rows.map(x=>`<tr><td>${x.event_type}</td><td><span class="tag">${x.trigger_source}</span></td><td><span class="tag ${x.result==='failed'?'coral':''}">${x.result}</span></td><td>${x.installer_version}</td><td>${x.remote_version||'—'}</td><td>${fmt(x.received_at)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">还没有动态记录</td></tr>';$('status').textContent='数据已更新 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false})}catch{$('status').textContent='暂时无法连接小岛服务'}}$('refresh').onclick=load;load();setInterval(load,60000);
</script></body></html>
